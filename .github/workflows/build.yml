name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Bluetooth dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libbluetooth-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Tests (all features)
        run: cargo test --all-features
      - name: Docs build without warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  build-linux:
    name: Build Linux (x86_64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Generate header
        run: |
          cargo install cbindgen
          cbindgen --config cbindgen.toml --crate obd_session_rs --output obd_session_rs.h
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/libobd_session_rs.a dist/
          cp obd_session_rs.h dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/

  build-windows:
    name: Build Windows (x86_64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Generate header
        run: |
          cargo install cbindgen
          cbindgen --config cbindgen.toml --crate obd_session_rs --output obd_session_rs.h
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/obd_session_rs.lib dist/
          cp obd_session_rs.h dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/

  build-macos-arm64:
    name: Build macOS (aarch64)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Generate header
        run: |
          cargo install cbindgen
          cbindgen --config cbindgen.toml --crate obd_session_rs --output obd_session_rs.h
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/libobd_session_rs.a dist/
          cp obd_session_rs.h dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/

  # iPad build (iPad_Build_Plan I0): device and simulator are the same arch
  # on different platforms — no fat lib; one artifact per SDK, mirroring the
  # local lib/ios-device + lib/ios-sim staging. Build-only: iOS binaries
  # can't execute on the runner (the test job above covers the code).
  build-ios:
    name: Build iOS (arm64 device + simulator)
    needs: test
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "18.2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build device slice
        run: cargo build --release --target aarch64-apple-ios
      - name: Build simulator slice
        run: cargo build --release --target aarch64-apple-ios-sim
      - name: Generate header
        run: |
          cargo install cbindgen
          cbindgen --config cbindgen.toml --crate obd_session_rs --output obd_session_rs.h
      - name: Package artifacts
        run: |
          mkdir -p dist/ios-device dist/ios-sim
          cp target/aarch64-apple-ios/release/libobd_session_rs.a dist/ios-device/
          cp target/aarch64-apple-ios-sim/release/libobd_session_rs.a dist/ios-sim/
          cp obd_session_rs.h dist/ios-device/
          cp obd_session_rs.h dist/ios-sim/
      - name: Upload device artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-device
          path: dist/ios-device/
      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim
          path: dist/ios-sim/
