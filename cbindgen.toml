# cbindgen configuration for obd_session_rs
# Generates C header file for FFI interface

language = "C"
header = """
/*
 * obd_session_rs - OBD-II Session Management Library
 * 
 * C Header for Swift/Objective-C Integration
 * Generated by cbindgen - DO NOT EDIT
 *
 * Usage:
 *   #include "obd_session_rs.h"
 */
"""
include_guard = "OBD_SESSION_RS_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"

# Include only FFI-marked items
[parse]
parse_deps = false

[export]
include = []
# RS7: the mock-platform trio is compiled only under the `ffi-test` cargo
# feature (tests/ffi_test.rs) and is never in the app-linked library —
# cbindgen can't see cargo features, so keep the header in sync by hand.
# SL4: the legacy host-driven stream kit joined them behind `ffi-test`.
exclude = [
  "obd_create_session", "obd_destroy_session", "obd_get_api_handle",
  "obd_start_stream", "obd_stream_arm", "obd_stream_break", "obd_stop_stream",
]

[fn]
# Rename pattern for functions
rename_args = "None"

[struct]
# Generate derives for structs
derive_eq = true

[enum]
# Rename enum variants
rename_variants = "None"

